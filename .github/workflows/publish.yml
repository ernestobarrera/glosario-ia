name: Publicar sitio Quarto

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Instalar la dependencia del preflight
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Comprobar datos privados
        run: >-
          python herramientas/preflight_publico.py .
          --patrones patrones-publicos.yml --destino-publico --historial

      - name: Instalar Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38

      - name: Renderizar el sitio
        uses: quarto-dev/quarto-actions/render@v2

      - name: Validar el glosario
        shell: pwsh
        run: ./validar.ps1

      - name: Guardar la previsualización del pull request
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: sitio-quarto-pr-${{ github.event.pull_request.number }}
          path: _site
          if-no-files-found: error
          retention-days: 7

      - name: Preparar el artefacto de Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
