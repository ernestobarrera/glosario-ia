project:
  type: website
  output-dir: _site
  render:
    - "*.qmd"
    - "terminos/*.qmd"
    - "atlas/*.qmd"
    # Los patrones de Quarto casan a cualquier profundidad, como los de git:
    # sin esta exclusion, "terminos/*.qmd" arrastra borradores/**/terminos/*.qmd
    # y el render local pasa de 75 a 370 paginas.
    - "!borradores/"
  preview:
    browser: false
    watch-inputs: true

website:
  title: "Glosario IA"
  description: "Glosario de IA para profesionales sanitarios: conceptos explicados con aplicaciones, limitaciones, ejemplos y referencias verificables."
  site-url: "https://ernestobarrera.github.io/glosario-ia/"
  favicon: favicon.svg
  repo-url: "https://github.com/ernestobarrera/glosario-ia"
  repo-actions: [edit, issue]
  search:
    location: navbar
    type: textbox
  page-navigation: true
  back-to-top-navigation: true
  open-graph: true
  navbar:
    # Fija: en una herramienta de consulta se salta de ficha en ficha y la
    # navegacion tiene que estar siempre a mano.
    pinned: true
    left:
      - href: index.qmd
        text: Inicio
      - href: indice-az.qmd
        text: A–Z
      - href: temas.qmd
        text: Temas
      - href: atlas.qmd
        text: Atlas visual
    # La guia de uso: en la portada y en las fichas, assets/guia.js la abre
    # en la misma pagina; en las demas, este enlace lleva a la de la portada.
    # Va en tools y no en right: en el movil, right queda dentro del menu
    # plegado y tools se ve siempre, junto al conmutador de tema.
    tools:
      - icon: question-circle-fill
        href: "index.html?tour=1"
        text: "Cómo se usa"
  # El enlace de vuelta a la web del autor va en el pie, no en la barra: la
  # barra es la navegacion del glosario y no debe mezclarse con la del sitio.
  page-footer:
    left: "Barrera E. · Textos originales bajo [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/deed.es)"
    right:
      - href: https://ernestobarrera.github.io/
        text: "Web del autor"
      - href: aviso.qmd
        text: "Aviso, límites y licencia"
  # Banner de consentimiento propio de Quarto: la libreria va en site_libs, no
  # en una CDN. Bloquea hasta que el lector acepta los scripts marcados
  # cookie-consent="tracking" (Google Analytics, mas abajo). language va
  # explicito: sin el, Quarto 1.9 lo genera en ingles aunque lang sea es.
  cookie-consent:
    type: express
    style: simple
    palette: light
    language: es
    prefs-text: "Preferencias de cookies"
    policy-url: "https://ernestobarrera.github.io/glosario-ia/aviso.html#cookies"

lang: es
# El texto del campo de filtro. Por defecto Quarto pone «Filtro», que no dice
# nada de lo que se puede escribir dentro; diciendolo aqui, la portada se ahorra
# la linea que lo anunciaba y el buscador se explica solo tambien en el A-Z.
language:
  listing-page-filter: "Busca un término, una sigla o un sinónimo…"
bibliography: references.bib
csl: vancouver.csl
filters:
  # Primero: rellena las listas de los recorridos, y los demas filtros ven ya
  # la pagina completa.
  - filters/recorridos.lua
  - filters/sinonimos.lua
  - filters/estado.lua
  - filters/matices.lua
  - filters/temas.lua
  - filters/atlas.lua
  - filters/guia.lua

format:
  html:
    include-in-header:
      - text: |
          <meta name="robots" content="noindex, nofollow">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
      # Google Analytics, solo tras aceptar el banner. NO se usa la opcion
      # google-analytics de Quarto: en 1.9.38 escribe la libreria de Google sin
      # bloquear y solo bloquea la configuracion, asi que la IP del lector sale
      # hacia Google aunque rechace. Aqui van bloqueadas las dos etiquetas; el
      # banner activa tambien la que lleva src (comprobado en su codigo).
      - text: |
          <script type="text/plain" cookie-consent="tracking" async src="https://www.googletagmanager.com/gtag/js?id=G-YFKR6RB1ZC"></script>
          <script type="text/plain" cookie-consent="tracking">
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-YFKR6RB1ZC');
          </script>
    theme:
      light: [cosmo, glosario.scss]
      dark: [cosmo, glosario-oscuro.scss]
    css: styles.css
    # La rejilla por defecto de Quarto reserva 800 px de cuerpo y 250 de margen:
    # en una pantalla de 14 pulgadas eso deja el texto flotando entre dos bandas
    # vacias. Aqui el cuerpo ES la medida de lectura, asi que los filetes de los
    # epigrafes acaban donde acaba el texto.
    grid:
      sidebar-width: 160px
      body-width: 800px
      margin-width: 220px
      gutter-width: 1.2rem
    toc: true
    toc-title: "En esta ficha"
    smooth-scroll: true
    link-external-newwindow: true

editor:
  markdown:
    wrap: 80
    references:
      location: document
    canonical: true
